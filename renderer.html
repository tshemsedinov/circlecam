<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CircleCam</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      #frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        background: rgba(15, 15, 15, 0.95);
        app-region: drag;
        -webkit-app-region: drag;
      }

      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
        background: black;
      }

      video.mirrored {
        transform: scaleX(-1);
      }

      #status {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 24px;
        text-align: center;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.35;
        color: white;
        background: rgba(0, 0, 0, 0.58);
        pointer-events: none;
      }

      #status.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <video id="video" autoplay muted playsinline></video>
      <div id="status">Opening camera…</div>
    </div>

    <script>
      'use strict';

      const query = new URLSearchParams(location.search);
      const CONFIG = JSON.parse(query.get('config'));
      const frame = document.getElementById('frame');
      const video = document.getElementById('video');
      const status = document.getElementById('status');
      let activeStream = null;

      frame.style.borderRadius = CONFIG.radius;
      frame.style.opacity = CONFIG.opacity;
      video.classList.toggle('mirrored', CONFIG.mirror);

      const asText = (value) => `${value ?? ''}`;

      const showStatus = (text) => {
        status.textContent = text;
        status.classList.remove('hidden');
      };

      const hideStatus = () => {
        status.classList.add('hidden');
      };

      const stopStream = (stream) => {
        if (stream === null) return;
        for (const track of stream.getTracks()) track.stop();
      };

      const normalizeName = (value) => {
        const text = value.toLowerCase();
        const spaced = text.replace(/[_:/]+/g, ' ');
        return spaced.replace(/\s+/g, ' ').trim();
      };

      const listCameras = async () => {
        const devices = await navigator.mediaDevices.enumerateDevices();
        return devices.filter((device) => device.kind === 'videoinput');
      };

      // labels and capabilities stay hidden until access is granted once
      const grantedCameras = async () => {
        const cameras = await listCameras();
        if (cameras.some((camera) => camera.label !== '')) return cameras;
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: true,
        });
        stopStream(stream);
        return listCameras();
      };

      const capabilitiesOf = (camera) => camera.getCapabilities?.() ?? {};

      const maxFps = (camera) => capabilitiesOf(camera).frameRate?.max ?? 0;

      const maxPixels = (camera) => {
        const { width, height } = capabilitiesOf(camera);
        return (width?.max ?? 0) * (height?.max ?? 0);
      };

      const isFast = (camera) => maxFps(camera) >= CONFIG.minFps;

      const compareCameras = (a, b) => {
        const fast = Number(isFast(b)) - Number(isFast(a));
        if (fast !== 0) return fast;
        return maxPixels(b) - maxPixels(a);
      };

      const candidateCameras = (cameras) => {
        if (CONFIG.camera === null) return cameras.toSorted(compareCameras);
        const needle = normalizeName(CONFIG.camera);
        const matches = cameras.filter((camera) => {
          const name = normalizeName(camera.label);
          return name.includes(needle);
        });
        if (matches.length === 0) {
          throw new Error(`No camera matches "${CONFIG.camera}"`);
        }
        return matches;
      };

      const constraintsFor = (camera) => {
        const scale = window.devicePixelRatio;
        const frameRate = { ideal: CONFIG.minFps };
        if (isFast(camera)) frameRate.min = CONFIG.minFps;
        return {
          deviceId: { exact: camera.deviceId },
          // only the pixels the window shows; larger frames cost CPU
          width: { ideal: Math.round(window.innerWidth * scale) },
          height: { ideal: Math.round(window.innerHeight * scale) },
          frameRate,
        };
      };

      const openCamera = async (camera) => {
        const constraints = constraintsFor(camera);
        try {
          return await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: constraints,
          });
        } catch (error) {
          console.error(error);
          return await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { deviceId: constraints.deviceId },
          });
        }
      };

      const logCameras = (cameras) => {
        console.log('Cameras:');
        for (let index = 0; index < cameras.length; index += 1) {
          const camera = cameras[index];
          const label = camera.label || camera.deviceId;
          console.log(`  [${index}] ${label}`);
        }
      };

      const logSelected = (camera, stream) => {
        const track = stream.getVideoTracks()[0];
        const actual = track.getSettings();
        const title = camera.label || track.label;
        const fps = (actual.frameRate ?? 0).toFixed(1);
        const summary = `${title} | ${actual.width}x${actual.height} @ ${fps}`;
        console.log(`Selected: ${summary} FPS`);
      };

      const openFirst = async (candidates) => {
        let failure = null;
        for (const camera of candidates) {
          showStatus(`Opening ${camera.label || 'camera'}…`);
          try {
            const stream = await openCamera(camera);
            logSelected(camera, stream);
            return stream;
          } catch (error) {
            console.error(error);
            failure = error;
          }
        }
        throw failure;
      };

      const start = async () => {
        try {
          if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error('getUserMedia is not available');
          }
          showStatus('Requesting camera access…');
          const cameras = await grantedCameras();
          if (cameras.length === 0) {
            throw new Error('No video-input cameras found');
          }
          logCameras(cameras);
          activeStream = await openFirst(candidateCameras(cameras));
          video.srcObject = activeStream;
          await video.play();
          hideStatus();
        } catch (error) {
          console.error(error);
          const message = asText(error.message) || asText(error);
          showStatus(`Camera error:\n${message}`);
        }
      };

      window.addEventListener('beforeunload', () => {
        stopStream(activeStream);
        activeStream = null;
      });

      start();
    </script>
  </body>
</html>
